name: Collect ESO stats

on:
  # The schedule is deliberately off. eso.lt sits behind Cloudflare, which
  # answers requests from GitHub's runners with the "Just a moment..." JS
  # challenge (HTTP 403) -- both for the JSON endpoint and for the page it
  # belongs to. The same request from a home connection is served normally,
  # so collection runs there instead; see README, "Где работает сбор".
  #
  # Re-enable this if the collector ever gets a host whose IP the site
  # serves: uncomment the two lines below, nothing else changes.
  #
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch snapshot
        run: python collector/collect.py

      - name: Commit snapshot
        run: |
          if [ -z "$(git status --porcelain docs/data)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "eso-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "data: snapshot $(date -u '+%Y-%m-%d %H:%M') UTC"
          # A concurrent run (or a manual push) can land first; rebase and retry.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            echo "push attempt ${attempt} failed, retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not push snapshot after 3 attempts"
          exit 1
